# BeamX internet server: relay + TURN + automatic HTTPS.
# Setup guide: server/README.md
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      TURN_URLS: "turn:${PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP}:3478?transport=tcp"
      TURN_SECRET: "${TURN_SECRET}"
    volumes:
      - relay-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [relay]

  turn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=beamx
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      # Never relay into private networks (stops the server being used to
      # reach machines on its own network).
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --total-quota=100
      - --user-quota=12

volumes:
  relay-data:
  caddy-data:
