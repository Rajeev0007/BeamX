name: beamx
description: BeamX - fast, secure screen sharing and remote control between all your devices.
publish_to: none
version: 0.4.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.0
  shared_preferences: ^2.3.0
  qr_flutter: ^4.1.0
  flutter_webrtc: ^1.6.2
  flutter_background: ^1.3.0
  crypto: ^3.0.6
  async: ^2.11.0
  file_picker: ^13.0.0
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.5
  ffi: ^2.1.3
  window_manager: ^0.5.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
