name: Build

# Builds BeamX for every platform. Pushing a tag like v0.1.0 also publishes
# a GitHub Release with checksums and signed build-provenance attestations.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib || echo "::warning::Run 'dart format lib' to tidy formatting"
      - run: flutter analyze --no-fatal-infos

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py android
      - run: flutter build apk --release $(bash tool/version_args.sh)
      # Smaller APKs for one phone type each (most phones: arm64).
      - run: flutter build apk --release --split-per-abi $(bash tool/version_args.sh)
      - name: Sign with release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$KEYSTORE_B64" ]; then
            # Stable releases (v1.2.3) must use the permanent key. Preview
            # tags (v1.2.3-preview) may use a temporary test key.
            if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != *-* ]]; then
              echo "::error::Stable releases need the ANDROID_KEYSTORE_* secrets (see docs/SETUP.md)"
              exit 1
            fi
            echo "::warning::No release key configured; APK uses a temporary test key"
            cp "$APK" ../dist/BeamX-android-preview.apk
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          OUT=build/app/outputs/flutter-apk
          sign() {
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
              --out "../dist/$2" "$1"
            "$APKSIGNER" verify --print-certs "../dist/$2" | head -1
          }
          sign "$APK" BeamX-android.apk
          sign "$OUT/app-arm64-v8a-release.apk" BeamX-android-arm64.apk
          sign "$OUT/app-armeabi-v7a-release.apk" BeamX-android-armv7.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python tool/prepare_platforms.py windows
      - run: flutter build windows --release $(bash tool/version_args.sh)
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../dist/BeamX-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  linux:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py linux
      - run: flutter build linux --release $(bash tool/version_args.sh)
      - run: |
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf ../dist/BeamX-linux-x64.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  apple:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py macos ios
      - name: macOS app (ad-hoc signed)
        run: |
          flutter build macos --release $(bash tool/version_args.sh)
          mkdir -p ../dist
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          codesign --force --deep --sign - "$APP"
          # hdiutil sometimes fails with "Resource busy" on hosted runners; retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname BeamX -srcfolder "$APP" -ov -format UDZO ../dist/BeamX-macos.dmg && break
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt), retrying in 10s"; sleep 10
          done
      - name: iOS app (unsigned, for AltStore/SideStore)
        run: |
          flutter build ios --release --no-codesign $(bash tool/version_args.sh)
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ../dist/BeamX-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign attestations
      attestations: write  # store attestations
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ contains(github.ref_name, '-') && '> **Preview build** for testing before the stable release. See the roadmap for what works so far. If the Android file is named BeamX-android-preview.apk, it uses a temporary key: uninstall it before installing a later version.' || '' }}

            ## Install
            See the [install guide](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md) for every platform.

            ## Verify your download
            Every file was built by GitHub Actions from this repository's public code.
            - Check the checksum against `SHA256SUMS.txt`
            - Or verify the build attestation: `gh attestation verify <file> --repo ${{ github.repository }}`
