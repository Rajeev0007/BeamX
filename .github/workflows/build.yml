name: Build

# Builds BeamX for every platform. Pushing a tag like v0.1.0 also publishes
# a GitHub Release with checksums and signed build-provenance attestations.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib || echo "::warning::Run 'dart format lib' to tidy formatting"
      - run: flutter analyze --no-fatal-infos

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --version && node --test test.mjs
      # Live check of the free public server used by "Connect from anywhere".
      # Not required to pass: it's a third-party service.
      - name: Public PeerJS server check
        continue-on-error: true
        run: timeout 90 node peerjs-check.mjs

  # Two BeamX devices in one process connect, stream for a minute and must
  # stay connected. Prints the diagnostics log. (Not required for release.)
  e2e:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libpulse-dev xvfb libxtst6 pulseaudio
      # Real computers have a sound system; the CI machine doesn't. WebRTC
      # opens audio devices when it starts, so give it a virtual one.
      - run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl info | head -5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py linux
      - run: xvfb-run -a -s "-screen 0 1280x720x24" flutter test integration_test/connection_test.dart -d linux --reporter expanded --verbose 2>&1 | grep -vE "^\[ +[0-9]+ ms\] (executing|Exit code|<-|->)" | tail -300

  e2e-windows:
    needs: analyze
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python tool/prepare_platforms.py windows
      - run: flutter test integration_test/connection_test.dart -d windows --reporter expanded --plain-name "two devices"

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py android
      # Main edition: installs on every phone, including where Play Protect's
      # fraud protection blocks apps with an accessibility service.
      - name: Build BeamX
        run: |
          OUT=build/app/outputs/flutter-apk
          flutter build apk --release $(bash tool/version_args.sh)
          flutter build apk --release --split-per-abi $(bash tool/version_args.sh)
          mkdir -p ../unsigned
          cp $OUT/app-release.apk ../unsigned/BeamX-android.apk
          cp $OUT/app-arm64-v8a-release.apk ../unsigned/BeamX-android-arm64.apk
          cp $OUT/app-armeabi-v7a-release.apk ../unsigned/BeamX-android-armv7.apk
      # Control edition: adds the accessibility service so the phone itself
      # can be remote-controlled.
      - name: Build BeamX Control
        env:
          BEAMX_CONTROL: '1'
        run: |
          OUT=build/app/outputs/flutter-apk
          python3 tool/prepare_platforms.py android
          flutter build apk --release $(bash tool/version_args.sh)
          flutter build apk --release --split-per-abi $(bash tool/version_args.sh)
          cp $OUT/app-release.apk ../unsigned/BeamX-Control-android.apk
          cp $OUT/app-arm64-v8a-release.apk ../unsigned/BeamX-Control-android-arm64.apk
      - name: Check editions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          if "$AAPT2" dump xmltree ../unsigned/BeamX-android-arm64.apk --file AndroidManifest.xml | grep -q BeamXAccessibilityService; then
            echo "::error::Main edition contains the accessibility service"; exit 1
          fi
          "$AAPT2" dump xmltree ../unsigned/BeamX-Control-android-arm64.apk --file AndroidManifest.xml | grep -q BeamXAccessibilityService \
            || { echo "::error::Control edition is missing the accessibility service"; exit 1; }
          echo "Editions checked: main without, Control with the accessibility service"
      - name: Sign with release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -z "$KEYSTORE_B64" ]; then
            # Stable releases (v1.2.3) must use the permanent key. Preview
            # tags (v1.2.3-preview) may use a temporary test key.
            if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != *-* ]]; then
              echo "::error::Stable releases need the ANDROID_KEYSTORE_* secrets (see docs/SETUP.md)"
              exit 1
            fi
            echo "::warning::No release key configured; APKs use a temporary test key"
            for f in ../unsigned/*.apk; do cp "$f" "../dist/$(basename "$f" .apk)-preview.apk"; done
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in ../unsigned/*.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
              --out "../dist/$(basename "$f")" "$f"
            echo "$(basename "$f"): $("$APKSIGNER" verify --print-certs "../dist/$(basename "$f")" | head -1)"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          # The main edition must not contain the accessibility service.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python tool/prepare_platforms.py windows
      - run: flutter build windows --release $(bash tool/version_args.sh)
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../dist/BeamX-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $env:BEAMX_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'iscc' }
          & $iscc tool\windows\beamx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  linux:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libpulse-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py linux
      - run: flutter build linux --release $(bash tool/version_args.sh)
      - run: |
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf ../dist/BeamX-linux-x64.tar.gz .
          bash tool/linux/make_deb.sh ../dist/BeamX-linux-amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  apple:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: python3 tool/prepare_platforms.py macos ios
      - name: macOS app (ad-hoc signed)
        run: |
          flutter build macos --release $(bash tool/version_args.sh)
          mkdir -p ../dist
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          codesign --force --deep --sign - "$APP"
          # hdiutil sometimes fails with "Resource busy" on hosted runners; retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname BeamX -srcfolder "$APP" -ov -format UDZO ../dist/BeamX-macos.dmg && break
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt), retrying in 10s"; sleep 10
          done
      - name: iOS app (unsigned, for AltStore/SideStore)
        run: |
          flutter build ios --release --no-codesign $(bash tool/version_args.sh)
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ../dist/BeamX-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign attestations
      attestations: write  # store attestations
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ contains(github.ref_name, '-') && '> **Preview build** for testing before the stable release. See the roadmap for what works so far. If the Android file is named BeamX-android-preview.apk, it uses a temporary key: uninstall it before installing a later version.' || '' }}

            ## Install
            See the [install guide](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md) for every platform.

            ## Verify your download
            Every file was built by GitHub Actions from this repository's public code.
            - Check the checksum against `SHA256SUMS.txt`
            - Or verify the build attestation: `gh attestation verify <file> --repo ${{ github.repository }}`
